name: CI Pipeline

on:
  push:
    branches: [ main, "refactor/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate-dwh-and-pipeline:
    name: "Validate Core DWH & Data Integrity"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: "Install Core Pipeline Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl numpy scikit-learn google-cloud-bigquery python-dotenv

      - name: "Syntax & Compilation Check"
        run: |
          python -m compileall -q src tests scripts

      - name: "Smoke Test Core ETL Imports (Tier: ETL)"
        run: |
          python tests/test_pipeline_imports.py --tier etl

      - name: "Validate Star Schema Referential Integrity & Data Quality"
        run: |
          python -m src.etl.validate_integrity
